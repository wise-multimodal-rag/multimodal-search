[project]
name = "multimodal-search"
version = "0.2.0"
description = "Multimodal search and RAG system using OpenSearch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "opensearch-py>=2.4.0",
    "litellm>=1.70.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
    "loguru>=0.7.0",
    "langfuse>=2.0.0",
]

[dependency-groups]
lint = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "setuptools>=82.0.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 125
exclude = [
    '.git',
    '__pycache__',
    '.ruff_cache',
    'docs',
    '.venv',
    'venv',
    'tests',
    'build',
    'dist',
    './app/__init__.py',
]
target-version = "py311"

[tool.ruff.lint]
select = [
    "D", # pydocstyle <https://docs.astral.sh/ruff/rules/#pydocstyle-d>
    "FAST"  # FastAPI <https://docs.astral.sh/ruff/rules/#fastapi-fast>
]
ignore = ['W', "D100", "D101", "D102", "D103", "D104", "D107", "D414", "D415", "D417", "FAST002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.pyright]
pythonVersion = "3.11"
defineConstant = { DEBUG = true }
reportMissingImports = false
reportMissingTypeStubs = false
reportArgumentType = false
typeCheckingMode = "basic"
include = ["app"]
exclude = [
    '.git',
    '__pycache__',
    '.ruff_cache',
    '.pytest_cache',
    'docs',
    'venv',
    '.venv',
    'tests',
    'build',
    'dist',
    'pypi',
    'app_logs',
    '.cache',
    'static',
    'templates',
    '.gitlab',
]
