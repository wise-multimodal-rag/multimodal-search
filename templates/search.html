<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Search</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <link rel="stylesheet" href="/static/css/search.css?v=30.0">
    <link rel="stylesheet" href="/static/css/streaming.css?v=29.0">
</head>
<body>
<div class="header" style="text-align: center; margin-bottom: 30px; padding-top: 40px;">
    <h1>Multimodal Search</h1>
    <p>OpenSearch 기반 멀티모달 검색 시스템</p>
</div>

<div class="container">

    <!-- 왼쪽 패널 -->
    <div class="left-panel">
        <!-- 검색 입력 -->
        <div class="search-input-container">
            <div class="search-input-header">
                <div class="search-input-title">검색 입력</div>
                <div class="search-input-description">텍스트와 미디어 파일을 조합하여 검색하세요</div>
            </div>

            <div class="chat-input">
                <div class="input-section">
                    <input type="text" id="messageInput" placeholder="검색어를 입력하세요">
                    <div class="file-inputs">
                        <input type="file" id="textFileInput" accept=".txt,.md,.csv,.json,.xml,.html,.pdf,text/*,application/pdf,application/json" style="display: none;">
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <input type="file" id="audioInput" accept="audio/*" style="display: none;">
                        <input type="file" id="videoInput" accept="video/*" style="display: none;">

                        <button type="button" class="file-btn" onclick="document.getElementById('textFileInput').click()">
                            📄
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('imageInput').click()">
                            📷
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('audioInput').click()">
                            🎵
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('videoInput').click()">
                            🎥
                        </button>
                    </div>
                </div>
                <button id="sendButton" onclick="sendMessage()">검색</button>
            </div>

            <div id="selectedFiles" class="selected-files"></div>
        </div>

        <!-- 검색 옵션 -->
        <div class="settings">
            <h3 style="margin: 0 0 15px 0;">검색 옵션</h3>

            <div class="option-group">
                <div class="settings-row">
                    <label>결과 수:</label>
                    <input type="number" id="maxResults" value="10" min="1" max="50" style="width: 70px;">
                </div>
            </div>

            <div class="option-group">
                <strong style="font-size: 13px; color: #495057; margin-bottom: 8px; display: block;">메타데이터 포함:</strong>
                <div class="checkbox-row">
                    <input type="checkbox" id="includeChunkMeta" checked>
                    <label for="includeChunkMeta">청크 메타데이터</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="includeMediaMeta" checked>
                    <label for="includeMediaMeta">미디어 메타데이터</label>
                </div>
            </div>
        </div>

        <!-- 빠른 검색 -->
        <div class="settings">
            <h3 style="margin: 0 0 15px 0;">빠른 검색</h3>

            <div class="quick-search-examples">
                <div class="example-buttons">
                    <button class="example-btn" onclick="setSearchExample('블루투스 설정 방법')">블루투스 설정 방법</button>
                    <button class="example-btn" onclick="setSearchExample('삼성 갤럭시')">삼성 갤럭시</button>
                    <button class="example-btn" onclick="setSearchExample('소니코리아 뉴에라')">소니코리아 뉴에라</button>
                    <button class="example-btn" onclick="setSearchExample('스픽 영어 챌린지')">스픽 영어 챌린지</button>
                </div>
            </div>
        </div>

        <!-- 검색 히스토리 -->
        <div class="search-history">
            <div class="search-history-title">최근 검색</div>
            <div class="search-history-list" id="searchHistory">
            </div>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 검색 결과 (최우선 표시) -->
        <div class="search-results-container">
            <div class="search-results-header" id="searchResultsHeader" style="display: none;">
                <div class="search-results-title">검색 결과</div>
                <div class="search-results-info" id="searchResultsInfo"></div>
            </div>

            <div class="search-results-content" id="searchResultsContent">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <div>검색어를 입력하거나 미디어 파일을 업로드하여 검색을 시작하세요</div>
                </div>
            </div>
        </div>

        <!-- 검색 과정 표시 (접을 수 있는 참고 자료) -->
        <div class="search-process-container" id="searchProcessContainer" style="display: none;">
            <div class="search-process-header">
                <h2>검색 진행 상황</h2>
                <div class="search-progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0/7 단계 완료</div>
            </div>
            
            <div class="search-steps" id="searchSteps">
                <!-- 동적으로 단계별 결과가 추가됨 -->
            </div>
        </div>
        </div>
    </div>
</div>

<!-- JavaScript 파일들 -->
<script src="/static/js/tooltipManager.js"></script>
<script src="/static/js/fileHandler.js?v=52.0"></script>
<script src="/static/js/historyManager.js?v=33.0"></script>
<script src="/static/js/uiController.js"></script>
<script src="/static/js/streamingSearch.js?v=51.0"></script>
<script src="/static/js/search.js?v=47.0"></script>
<script>
    // 앱 초기화
    document.addEventListener('DOMContentLoaded', function () {
        // FileHandler가 없으면 강제로 초기화
        if (!window.fileHandler) {
            try {
                window.fileHandler = new FileHandler();
            } catch (error) {
                console.error('FileHandler 초기화 실패:', error);
            }
        }
        
        if (window.uiController) {
            window.uiController.initialize();
        }
        if (window.historyManager) {
            window.historyManager.initialize();
        }
        
        // textFileInput에 직접 이벤트 리스너 추가하고 파일 표시 로직도 구현
        const testTextInput = document.getElementById('textFileInput');
        const selectedFilesDiv = document.getElementById('selectedFiles');
        
        if (testTextInput && selectedFilesDiv) {
            
            // 선택된 파일들을 저장할 임시 객체
            window.tempSelectedFiles = {
                image: null,
                video: null,
                audio: null,
                text_file: null
            };
            
            testTextInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    
                    // 파일 저장
                    window.tempSelectedFiles.text_file = file;
                    
                    // UI 업데이트
                    updateFilePreview();
                }
            });
            
            // 다른 파일 입력들에도 이벤트 리스너 추가
            ['imageInput', 'audioInput', 'videoInput'].forEach(inputId => {
                const input = document.getElementById(inputId);
                if (input) {
                    input.addEventListener('change', function(e) {
                        if (e.target.files && e.target.files[0]) {
                            const type = inputId.replace('Input', '');
                            window.tempSelectedFiles[type] = e.target.files[0];
                            updateFilePreview();
                        }
                    });
                }
            });
            
            function updateFilePreview() {
                selectedFilesDiv.innerHTML = '';
                
                Object.entries(window.tempSelectedFiles).forEach(([type, file]) => {
                    if (file) {
                        const preview = document.createElement('div');
                        preview.className = 'file-preview';
                        
                        const emoji = type === 'image' ? '📷' : type === 'video' ? '🎥' : type === 'audio' ? '🎵' : '📄';
                        const size = (file.size / 1024 / 1024).toFixed(1);
                        
                        preview.innerHTML = `
                            ${emoji} ${file.name} (${size}MB)
                            <span class="remove-file" onclick="removeFile('${type}')">×</span>
                        `;
                        
                        selectedFilesDiv.appendChild(preview);
                    }
                });
            }
            
            // 전역 함수로 파일 제거 기능
            window.removeFile = function(type) {
                window.tempSelectedFiles[type] = null;
                const input = document.getElementById(type === 'text_file' ? 'textFileInput' : type + 'Input');
                if (input) input.value = '';
                updateFilePreview();
            };
            
            // 파일 존재 여부 확인 함수
            window.hasFiles = function() {
                return Object.values(window.tempSelectedFiles).some(file => file !== null);
            };
            
            // 선택된 파일들 반환 함수
            window.getSelectedFiles = function() {
                return window.tempSelectedFiles;
            };
        }
    });
</script>
</body>
</html>
