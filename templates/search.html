<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal RAG</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <link rel="stylesheet" href="/static/css/search.css?v=34.0">
    <link rel="stylesheet" href="/static/css/streaming.css?v=32.0">
</head>
<body>
<div class="header" style="text-align: center; margin-bottom: 30px; padding-top: 40px;">
    <h1>Multimodal RAG</h1>
    <p>Multimodal RAG System based on Opensearch</p>
</div>

<div class="container">

    <!-- 왼쪽 패널 -->
    <div class="left-panel">
        <!-- 검색 입력 -->
        <div class="search-input-container">
            <div class="search-input-header">
                <div class="search-input-title">멀티모달 검색</div>
                <div class="search-input-description">텍스트와 미디어 파일을 조합하여 검색하고, LLM 답변을 생성할 수 있습니다</div>
            </div>

            <div class="chat-input">
                <div class="input-section">
                    <input type="text" id="messageInput" placeholder="검색어를 입력하세요 (Enter: 검색, Shift+Enter: LLM답변생성)">
                </div>
                
                <div class="action-row">
                    <div class="file-inputs">
                        <input type="file" id="textFileInput" accept=".txt,.md,.csv,.json,.xml,.html,.pdf,text/*,application/pdf,application/json" style="display: none;">
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <input type="file" id="audioInput" accept="audio/*" style="display: none;">
                        <input type="file" id="videoInput" accept="video/*" style="display: none;">

                        <button type="button" class="file-btn" onclick="document.getElementById('textFileInput').click()">
                            📄
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('imageInput').click()">
                            📷
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('audioInput').click()">
                            🎵
                        </button>
                        <button type="button" class="file-btn" onclick="document.getElementById('videoInput').click()">
                            🎥
                        </button>
                    </div>
                    
                    <div class="button-group">
                        <button id="searchButton" onclick="performSearch()">검색</button>
                        <button id="generateButton" onclick="performSearchAndGenerate()">LLM 답변 생성</button>
                        <button id="stopButton" onclick="stopSearch()" style="display: none;">중지</button>
                    </div>
                </div>
            </div>

            <div id="selectedFiles" class="selected-files"></div>
        </div>

        <!-- 검색 옵션 -->
        <div class="settings">
            <h3 style="margin: 0 0 15px 0;">검색 옵션</h3>

            <div class="option-group">
                <div class="settings-row">
                    <label>결과 수:</label>
                    <input type="number" id="maxResults" value="5" min="1" max="50" style="width: 70px;">
                </div>
            </div>

            <div class="option-group">
                <strong style="font-size: 13px; color: #495057; margin-bottom: 8px; display: block;">메타데이터 포함:</strong>
                <div class="checkbox-row">
                    <input type="checkbox" id="includeChunkMeta" checked>
                    <label for="includeChunkMeta">청크 메타데이터</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="includeMediaMeta" checked>
                    <label for="includeMediaMeta">미디어 메타데이터</label>
                </div>
            </div>

        </div>

        <!-- 빠른 검색 -->
        <div class="settings">
            <h3 style="margin: 0 0 15px 0;">빠른 검색</h3>

            <div class="quick-search-examples">
                <div class="example-buttons">
                    <button class="example-btn" onclick="setSearchExample('블루투스 설정 방법')">블루투스 설정 방법</button>
                    <button class="example-btn" onclick="setSearchExample('삼성 갤럭시')">삼성 갤럭시</button>
                    <button class="example-btn" onclick="setSearchExample('소니코리아 뉴에라')">소니코리아 뉴에라</button>
                    <button class="example-btn" onclick="setSearchExample('스픽 영어 챌린지')">스픽 영어 챌린지</button>
                </div>
            </div>
        </div>

        <!-- 검색 히스토리 -->
        <div class="search-history">
            <div class="search-history-title">최근 검색</div>
            <div class="search-history-list" id="searchHistory">
            </div>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- AI 생성 답변 레이어 -->
        <div class="ai-answer-container" id="aiAnswerContainer" style="display: none;">
            <div class="ai-answer-header" id="aiAnswerHeader">
                <div class="ai-answer-title">생성된 답변</div>
                <div class="ai-answer-info" id="aiAnswerInfo">검색 결과를 기반으로 생성된 AI 답변입니다</div>
            </div>
            <div class="ai-answer-content" id="aiAnswerContent">
                <!-- AI 답변 내용이 여기에 동적으로 추가됩니다 -->
            </div>
        </div>

        <!-- 검색 결과 (최우선 표시) -->
        <div class="search-results-container">
            <div class="search-results-header" id="searchResultsHeader" style="display: none;">
                <div class="search-results-title">검색 결과</div>
                <div class="search-results-info" id="searchResultsInfo"></div>
            </div>

            <div class="search-results-content" id="searchResultsContent">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <div>검색어를 입력하거나 미디어 파일을 업로드하여 검색을 시작하세요</div>
                </div>
            </div>
        </div>

        <!-- 검색 과정 표시 (접을 수 있는 참고 자료) -->
        <div class="search-process-container" id="searchProcessContainer" style="display: none;">
            <div class="search-process-header">
                <h2>진행 상황</h2>
                <div class="search-progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0단계 완료</div>
            </div>
            
            <div class="search-steps" id="searchSteps">
                <!-- 동적으로 단계별 결과가 추가됨 -->
            </div>
        </div>
        </div>
    </div>
</div>

<!-- JavaScript 파일들 -->
<!-- Configuration (load first) -->
<script src="/static/js/config/appConfig.js?v=1.0"></script>

<!-- State Management -->
<script src="/static/js/state/stateManager.js?v=1.0"></script>
<script src="/static/js/state/stateHelpers.js?v=1.0"></script>

<!-- External Libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

<!-- Utilities (dependencies first) -->
<script src="/static/js/utils/dataUtils.js?v=1.0"></script>
<script src="/static/js/utils/textFormatter.js?v=3.0"></script>
<script src="/static/js/utils/metadataCreator.js?v=1.0"></script>
<script src="/static/js/utils/searchDataProcessor.js?v=1.0"></script>

<!-- Managers -->
<script src="/static/js/managers/tooltipManager.js"></script>
<script src="/static/js/managers/historyManager.js?v=33.0"></script>
<script src="/static/js/managers/retryManager.js?v=1.0"></script>

<!-- Handlers -->
<script src="/static/js/handlers/fileHandler.js?v=52.0"></script>

<!-- Streaming modules -->
<script src="/static/js/streaming/progressManager.js?v=5.0"></script>
<script src="/static/js/streaming/streamingHandler.js?v=5.0"></script>
<script src="/static/js/streaming/searchStepRenderer.js?v=13.0"></script>
<script src="/static/js/streaming/searchResultRenderer.js?v=13.0"></script>
<script>
// EMERGENCY IMAGE FIX - 임시 이미지 표시 해결책
document.addEventListener('DOMContentLoaded', function() {
    console.log('🖼️ Origin image display handler loaded');
    
    // MutationObserver로 DOM 변경 감지
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.type === 'childList') {
                // 새로 추가된 검색 결과에서 origin 타입 찾기
                const searchCards = document.querySelectorAll('.search-result-card');
                searchCards.forEach(function(card, index) {
                    const typeElement = card.querySelector('.search-result-type');
                    if (typeElement && typeElement.textContent.includes('origin')) {
                        // 이미 처리된 카드인지 확인 (무한 루프 방지)
                        if (card.classList.contains('emergency-processed')) {
                            console.log('⏭️ SKIPPING ALREADY PROCESSED CARD:', index);
                            return;
                        }
                        
                        console.log('🎯 FOUND ORIGIN CARD:', index);
                        
                        // 처리됨 표시
                        card.classList.add('emergency-processed');
                        
                        const contentDiv = card.querySelector('.search-result-content');
                        if (contentDiv) {
                            console.log('🔍 CONTENT DIV FOUND:', contentDiv);
                            console.log('🔍 CONTENT DIV HTML:', contentDiv.innerHTML);
                            
                            // content-text에서 URL 추출
                            const contentText = contentDiv.querySelector('.content-text');
                            console.log('🔍 CONTENT TEXT ELEMENT:', contentText);
                            
                            if (contentText) {
                                console.log('🔍 CONTENT TEXT CONTENT:', contentText.textContent);
                                // 더 관대한 정규식 - 한글, 특수문자, 공백 모두 허용
                                let urlMatch = contentText.textContent.match(/http[s]?:\/\/.*\.(?:png|jpg|jpeg|gif|webp)/i);
                                console.log('🔍 URL MATCH RESULT (flexible):', urlMatch);
                                
                                // 첫 번째 정규식이 실패하면 더 간단한 방식 시도
                                if (!urlMatch) {
                                    const text = contentText.textContent.trim();
                                    console.log('🔍 Trying simple URL detection on:', text);
                                    if (text.includes('http') && (text.includes('.png') || text.includes('.jpg') || text.includes('.jpeg') || text.includes('.gif') || text.includes('.webp'))) {
                                        urlMatch = [text]; // 전체 텍스트를 URL로 사용
                                        console.log('🔍 Simple detection success:', urlMatch);
                                    }
                                }
                                
                                if (urlMatch) {
                                    const imageUrl = urlMatch[0];
                                    console.log('🖼️ EXTRACTED IMAGE URL:', imageUrl);
                                    
                                    // 기존 content-text 숨기고 이미지 추가
                                    contentText.style.display = 'none';
                                    
                                    const imageHtml = `
                                        <div class="image-preview" style="margin: 15px 0;">
                                            <img src="${imageUrl}" alt="Origin Image" 
                                                 class="result-image"
                                                 style="max-width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"
                                                 onload="console.log('✅ Image loaded successfully:', this.src)"
                                                 onerror="console.error('❌ Image load failed:', this.src); this.style.display='none'; this.nextElementSibling.style.display='block';">
                                            <div class="image-error" style="display: none; padding: 15px; background: #f8f9fa; border: 1px dashed #ccc; text-align: center; color: #666; border-radius: 8px;">
                                                ❌ 이미지를 불러올 수 없습니다<br>
                                                <small style="word-break: break-all; font-size: 11px;">${imageUrl}</small><br><br>
                                                <a href="${imageUrl}" target="_blank" style="color: #007bff; text-decoration: none;">
                                                    🔗 새 탭에서 열기
                                                </a>
                                            </div>
                                        </div>
                                    `;
                                    
                                    // Observer 일시 중단
                                    observer.disconnect();
                                    
                                    contentDiv.insertAdjacentHTML('afterbegin', imageHtml);
                                    console.log('✅ Origin image inserted successfully');
                                    
                                    // Observer 재시작 (잠시 후)
                                    setTimeout(function() {
                                        observer.observe(resultsContainer, { childList: true, subtree: true });
                                        console.log('🔄 OBSERVER RESTARTED');
                                    }, 100);
                                }
                            } else {
                                // content-text가 없으면 전체 contentDiv에서 URL 찾기
                                console.log('⚠️ NO CONTENT-TEXT, SEARCHING IN ENTIRE CONTENT DIV');
                                const allText = contentDiv.textContent || contentDiv.innerText;
                                console.log('🔍 ALL CONTENT TEXT:', allText);
                                
                                // 더 관대한 정규식 사용
                                let urlMatch = allText.match(/http[s]?:\/\/.*\.(?:png|jpg|jpeg|gif|webp)/i);
                                console.log('🔍 URL MATCH IN ALL TEXT (flexible):', urlMatch);
                                
                                // 첫 번째 정규식이 실패하면 더 간단한 방식 시도
                                if (!urlMatch) {
                                    if (allText.includes('http') && (allText.includes('.png') || allText.includes('.jpg') || allText.includes('.jpeg') || allText.includes('.gif') || allText.includes('.webp'))) {
                                        urlMatch = [allText.trim()]; // 전체 텍스트를 URL로 사용
                                        console.log('🔍 Simple detection in all text success:', urlMatch);
                                    }
                                }
                                
                                if (urlMatch) {
                                    const imageUrl = urlMatch[0];
                                    console.log('🖼️ EXTRACTED IMAGE URL FROM ALL TEXT:', imageUrl);
                                    
                                    const imageHtml = `
                                        <div class="image-preview" style="margin: 15px 0;">
                                            <img src="${imageUrl}" alt="Origin Image" 
                                                 class="result-image"
                                                 style="max-width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"
                                                 onload="console.log('✅ Image loaded successfully:', this.src)"
                                                 onerror="console.error('❌ Image load failed:', this.src); this.style.display='none'; this.nextElementSibling.style.display='block';">
                                            <div class="image-error" style="display: none; padding: 15px; background: #f8f9fa; border: 1px dashed #ccc; text-align: center; color: #666; border-radius: 8px;">
                                                ❌ 이미지를 불러올 수 없습니다<br>
                                                <small style="word-break: break-all; font-size: 11px;">${imageUrl}</small><br><br>
                                                <a href="${imageUrl}" target="_blank" style="color: #007bff; text-decoration: none;">
                                                    🔗 새 탭에서 열기
                                                </a>
                                            </div>
                                        </div>
                                    `;
                                    
                                    // Observer 일시 중단
                                    observer.disconnect();
                                    
                                    contentDiv.insertAdjacentHTML('afterbegin', imageHtml);
                                    console.log('✅ Origin image inserted successfully (from all text)');
                                    
                                    // Observer 재시작 (잠시 후)
                                    setTimeout(function() {
                                        observer.observe(resultsContainer, { childList: true, subtree: true });
                                        console.log('🔄 OBSERVER RESTARTED FROM ALL TEXT');
                                    }, 100);
                                }
                            }
                        }
                    }
                });
            }
        });
    });
    
    // 검색 결과 컨테이너 관찰 시작
    const resultsContainer = document.getElementById('searchResultsContent');
    if (resultsContainer) {
        observer.observe(resultsContainer, { childList: true, subtree: true });
        console.log('👀 OBSERVER STARTED ON:', resultsContainer);
    }
});
</script>

<!-- Core controllers -->
<script src="/static/js/core/uiController.js?v=16.0"></script>
<script src="/static/js/core/streamingSearch.js?v=67.0"></script>
<script src="/static/js/core/search.js?v=106.0"></script>
<script>
    // 서버 설정 로드 함수
    async function loadServerConfiguration() {
        try {
            const response = await fetch('/api/v1/config/client');
            if (response.ok) {
                const serverConfig = await response.json();
                window.appConfig.injectServerConfig(serverConfig);
                console.log('✅ Server configuration loaded successfully');
            } else {
                console.warn('⚠️ Failed to load server configuration, using defaults');
            }
        } catch (error) {
            console.error('❌ Error loading server configuration:', error);
            console.log('🔄 Continuing with default configuration');
        }
    }

    // 앱 초기화
    document.addEventListener('DOMContentLoaded', async function () {
        // 서버 설정 로드
        await loadServerConfiguration();
        
        // FileHandler가 없으면 강제로 초기화
        if (!window.fileHandler) {
            try {
                window.fileHandler = new FileHandler();
            } catch (error) {
                console.error('FileHandler 초기화 실패:', error);
            }
        }
        
        if (window.uiController) {
            window.uiController.initialize();
        }
        if (window.historyManager) {
            window.historyManager.initialize();
        }
        
        // textFileInput에 직접 이벤트 리스너 추가하고 파일 표시 로직도 구현
        const testTextInput = document.getElementById('textFileInput');
        const selectedFilesDiv = document.getElementById('selectedFiles');
        
        if (testTextInput && selectedFilesDiv) {
            
            // 선택된 파일들은 이제 상태 관리자에서 관리
            // window.tempSelectedFiles 대신 window.stateManager 사용
            
            testTextInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    
                    // 파일 저장 (상태 관리자 사용)
                    window.searchState.selectFile('text_file', file);
                    
                    // UI 업데이트
                    updateFilePreview();
                }
            });
            
            // 다른 파일 입력들에도 이벤트 리스너 추가
            ['imageInput', 'audioInput', 'videoInput'].forEach(inputId => {
                const input = document.getElementById(inputId);
                if (input) {
                    input.addEventListener('change', function(e) {
                        if (e.target.files && e.target.files[0]) {
                            const type = inputId.replace('Input', '');
                            window.searchState.selectFile(type, e.target.files[0]);
                            updateFilePreview();
                        }
                    });
                }
            });
            
            function updateFilePreview() {
                selectedFilesDiv.innerHTML = '';
                
                const selectedFiles = window.searchState.getSelectedFiles();
                Object.entries(selectedFiles).forEach(([type, file]) => {
                    if (file) {
                        const preview = document.createElement('div');
                        preview.className = 'file-preview';
                        
                        const emoji = type === 'image' ? '📷' : type === 'video' ? '🎥' : type === 'audio' ? '🎵' : '📄';
                        const size = (file.size / 1024 / 1024).toFixed(1);
                        
                        preview.innerHTML = `
                            ${emoji} ${file.name} (${size}MB)
                            <span class="remove-file" onclick="removeFile('${type}')">×</span>
                        `;
                        
                        selectedFilesDiv.appendChild(preview);
                    }
                });
            }
            
            // 전역 함수로 파일 제거 기능
            window.removeFile = function(type) {
                window.searchState.removeFile(type);
                const input = document.getElementById(type === 'text_file' ? 'textFileInput' : type + 'Input');
                if (input) input.value = '';
                updateFilePreview();
            };
            
            // 파일 존재 여부 확인 함수
            window.hasFiles = function() {
                return window.searchState.hasFiles();
            };
            
            // 선택된 파일들 반환 함수
            window.getSelectedFiles = function() {
                return window.searchState.getSelectedFiles();
            };
        }
        
        // 전역 함수들은 search.js에서 정의됨
    });
</script>
</body>
</html>
